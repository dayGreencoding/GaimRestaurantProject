<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Gaigrill — Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root{ --bg1:#ff9966; --bg2:#ff5e62; --card:#2b1e1e; --ink:#fff; --muted:#ffd1d1; --accent:#ff3d7a; }
        *{ box-sizing:border-box; }
        body{
          margin:0; min-height:100vh; display:grid; place-items:center;
          background:linear-gradient(120deg,var(--bg1),var(--bg2)); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        }
        .box{
          width:min(420px,92vw); background:var(--card); color:var(--ink);
          padding:28px 26px 22px; border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.25);
          text-align:center;
        }
        h2{ margin:0 0 14px; letter-spacing:.3px; }
        .hint{ color:var(--muted); font-size:12px; margin-top:10px; }
        input{
          width:100%; padding:12px 14px; margin:10px 0;
          border-radius:10px; border:1px solid #523d3d; background:#3a2b2b; color:#fff; outline:none;
        }
        input[readonly]{ opacity:.9 }
        button{
          width:100%; padding:12px 14px; margin-top:8px; border:none; border-radius:999px;
          background:linear-gradient(135deg,#ff6347,var(--accent)); color:#fff; font-weight:700; cursor:pointer;
          box-shadow:0 10px 25px rgba(0,0,0,.25); transition:.2s transform;
        }
        button:hover{ transform:translateY(-1px) }
        #error{ color:#ff9aa2; margin-top:10px; min-height:18px }
        .small{ font-size:12px; opacity:.9; margin-top:10px }
    </style>
</head>
<body>

<div class="box">
    <h2>Enter Passcode</h2>

    <form id="loginForm" autocomplete="off">
        <input type="text" id="userId" name="employeeId" placeholder="Employee ID" readonly />
        <input type="password" id="passcode" name="passcode" placeholder="Enter Passcode" required />
        <button type="submit" id="loginBtn">Login</button>
    </form>

    <div id="error"></div>
    <div class="small">You were redirected here with a User ID. If it’s blank, go back and choose your role.</div>
</div>

<script>
    // --- Prefill employeeId from ?userId=ADMIN04892 etc.
    (function prefill() {
      const params = new URLSearchParams(location.search);
      const fromQuery = params.get('userId');
      const stored = sessionStorage.getItem('employeeId'); // in case coming back
      document.getElementById('userId').value = fromQuery || stored || '';
    })();

    const $ = sel => document.querySelector(sel);
    const setBusy = (busy) => { $('#loginBtn').disabled = busy; $('#loginBtn').textContent = busy ? 'Logging in…' : 'Login'; };

    // --- Handle login
    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#error').textContent = '';

      const employeeId = $('#userId').value.trim();
      const passcode   = $('#passcode').value;

      if (!employeeId) { $('#error').textContent = 'Missing Employee ID.'; return; }
      if (!passcode)   { $('#error').textContent = 'Enter your passcode.'; return; }

      setBusy(true);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employeeId, passcode })
        });

        if (!res.ok) {
          const txt = await res.text().catch(()=> 'Invalid passcode');
          $('#error').textContent = txt || 'Invalid passcode';
          return;
        }

        const data = await res.json(); // {redirect, employeeId, name, department, issueKey}
        // Save minimal session info for dashboard/logout
        sessionStorage.setItem('employeeId', data.employeeId || employeeId);
        sessionStorage.setItem('employeeName', data.name || '');
        sessionStorage.setItem('department', data.department || '');
        // optional: store issueKey if you want to display it
        if (data.issueKey) sessionStorage.setItem('jiraIssueKey', data.issueKey);

        // Go to the right dashboard (admin vs employee decided server-side)
        location.href = data.redirect || '/employee-dashboard.html';
      } catch (err) {
        console.error(err);
        $('#error').textContent = 'Network error. Please try again.';
      } finally {
        setBusy(false);
      }
    });
</script>
</body>
</html>
