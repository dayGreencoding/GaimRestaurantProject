<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gaigrill Kitchen Dashboard</title>
    <style>
        body {
          margin: 0;
          font-family: 'Segoe UI', sans-serif;
          background: #e3f2fd;
          color: #333;
        }

        header {
          background-color: #1976d2;
          color: white;
          padding: 20px;
          text-align: center;
          font-size: 24px;
        }
                nav {
          display: flex;
          justify-content: space-around;
          background-color: #63a4ff;
          padding: 15px;
        }
                nav a {
          color: white;
          text-decoration: none;
          font-weight: bold;
        }

        nav a:hover {
          text-decoration: underline;
        }
        #orders td, #orders th {
            border: 1px solid #ddd;
            padding: 8px;
            font-size: xx-large;
        }
        .center{
        margin-left: auto;
        margin-right: auto;
        }
        #orders tr:nth-child(even){background-color: #f2f2f2;}
        #orders tr:nth-child(odd){background-color: #ffffff;}

        #orders tr:hover {background-color: #ddd;}

        #orders th {
            padding-top: 12px;
            padding-bottom: 12px;
            text-align: center;
            background-color: #63a4ff;
            color: white;
        }
        #orders td{
            text-align: center;
        }
    </style>
</head>
<body>
<header>Gaigrill Restaurant - Kitchen Dashboard</header>
<nav>
    <a href='#'>Order Status</a>
    <a href='#'>Schedule</a>
    <a href='#'>Logout</a>
</nav>
<section>
     <table id="orders" class="center">
         <tr>
             <th>Order ID</th>
             <th>Customer ID</th>
             <th>First Name</th>
             <th>Last Name</th>
             <th>Item Name</th>
             <th>Quantity</th>
             <th>Total Amount</th>
             <th>Status</th>
         </tr>
         <tr>
             <td>11111</td>
             <td>11111</td>
             <td>John</td>
             <td>Doe</td>
             <td>Sweet Corn Veg Soup</td>
             <td>2</td>
             <td>2</td>
             <td>pending</td>
         </tr>
         <tr>
             <td>22222</td>
             <td>22222</td>
             <td>Bill</td>
             <td>Withers</td>
             <td>Chicken Tikka Masala</td>
             <td>3</td>
             <td>3</td>
             <td>pending</td>
         </tr>
     </table>
</section>
</body>
</html>
